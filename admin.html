<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩偶展示櫃 - 管理端</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --pink:#ff8fab; --pink-dark:#e75480; --bg:#fff5f7; --shadow:0 4px 12px rgba(0,0,0,0.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:#333; padding:20px; }
  header { text-align:center; margin-bottom:20px; }
  h1 { color:var(--pink-dark); margin-bottom:4px; }
  .stats { display:flex; justify-content:center; gap:24px; margin-bottom:16px; font-size:15px; }
  .stats span b { color:var(--pink-dark); }
  .toolbar { display:flex; justify-content:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
  button { cursor:pointer; border:none; border-radius:20px; padding:10px 20px; font-size:14px; font-weight:bold; transition:transform .15s; }
  button:hover { transform:translateY(-2px); }
  .btn-primary { background:var(--pink); color:#fff; }
  .btn-secondary { background:#eee; color:#555; }
  .btn-danger { background:#ffdcdc; color:#c0392b; }
  .btn-sold { background:#d1ffd6; color:#1e7d32; }
  .btn-sold.is-sold { background:#ffd1d1; color:#c0392b; }
  .tabs { display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
  .tab { padding:8px 18px; border-radius:20px; background:#eee; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--pink-dark); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; max-width:1200px; margin:0 auto; }
  .card { background:#fff; border-radius:16px; box-shadow:var(--shadow); overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .card.sold { background:#f0f0f0; }
  .img-wrap { position:relative; width:100%; aspect-ratio:1/1; background:#fafafa; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; }
  .img-wrap img { width:100%; height:100%; object-fit:cover; }
  .card.sold .img-wrap img { filter:grayscale(85%) brightness(.85); }
  .img-placeholder { color:#bbb; font-size:14px; text-align:center; padding:10px; }
  .sold-badge { position:absolute; top:10px; right:-30px; background:var(--pink-dark); color:#fff; padding:4px 40px; font-size:12px; font-weight:bold; transform:rotate(35deg); display:none; }
  .card.sold .sold-badge { display:block; }
  .card-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .name-input, .price-input { border:1px solid #eee; border-radius:8px; padding:6px 10px; font-size:14px; width:100%; }
  .name-input { font-weight:bold; font-size:15px; }
  .price-row { display:flex; align-items:center; gap:6px; }
  .price-row span { color:var(--pink-dark); font-weight:bold; }
  .card-actions { display:flex; gap:8px; margin-top:auto; }
  .card-actions button { flex:1; padding:8px; font-size:13px; }
  .order-card { background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:16px; max-width:600px; margin:0 auto 16px; }
  .order-card h3 { margin:0 0 6px; color:var(--pink-dark); }
  .order-card ul { margin:8px 0; padding-left:20px; }
  .order-status { font-size:12px; padding:2px 10px; border-radius:10px; font-weight:bold; }
  .order-status.pending { background:#fff3cd; color:#997404; }
  .order-status.done { background:#d1ffd6; color:#1e7d32; }
  .login-box { max-width:340px; margin:100px auto; background:#fff; padding:30px; border-radius:16px; box-shadow:var(--shadow); text-align:center; }
  .login-box input { width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-bottom:12px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h2>🔒 管理員登入</h2>
  <input type="password" id="pwInput" placeholder="輸入管理密碼">
  <button class="btn-primary" style="width:100%" onclick="checkLogin()">登入</button>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🧸 玩偶展示櫃 - 管理端</h1>
    <div class="stats">
      <span>總數：<b id="statTotal">0</b></span>
      <span>未售出：<b id="statAvailable">0</b></span>
      <span>已售出：<b id="statSold">0</b></span>
      <span>待處理訂單：<b id="statOrders">0</b></span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="dolls" onclick="switchTab('dolls')">📦 玩偶管理</div>
    <div class="tab" data-tab="orders" onclick="switchTab('orders')">🛒 客人訂單</div>
  </div>

  <div id="dollsTab">
    <div class="toolbar">
      <button class="btn-primary" onclick="addCard()">➕ 新增玩偶</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="ordersTab" class="hidden">
    <div id="ordersList"></div>
  </div>
</div>

<script>
// ====== 請填入你的 Supabase 專案資訊 ======
const SUPABASE_URL = 'https://xukivnefbzctctgvzedk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1a2l2bmVmYnpjdGN0Z3Z6ZWRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTUxNjEsImV4cCI6MjEwNTI5MTE2MX0.Hlxb6GgBq_V-z0epfvDa7WckgrLKiFU6sLJP8KnRAYk';
const ADMIN_PASSWORD = 'eugene123';  // 建議改成你自己的密碼
// ==========================================

// 注意：這裡改名為 sb，避免跟 CDN 函式庫本身的全域變數 `supabase` 衝突
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let dolls = [];
let orders = [];

function checkLogin() {
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    init();
  } else {
    alert('密碼錯誤');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('dollsTab').classList.toggle('hidden', tab !== 'dolls');
  document.getElementById('ordersTab').classList.toggle('hidden', tab !== 'orders');
}

async function init() {
  await loadDolls();
  await loadOrders();
  sb.channel('dolls-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'dolls' }, loadDolls).subscribe();
  sb.channel('orders-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, loadOrders).subscribe();
}

async function loadDolls() {
  const { data, error } = await sb.from('dolls').select('*').order('created_at', { ascending: false });
  if (!error) { dolls = data; renderDolls(); } else { console.error(error); }
}

async function loadOrders() {
  const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
  if (!error) { orders = data; renderOrders(); } else { console.error(error); }
}

function updateStats() {
  document.getElementById('statTotal').textContent = dolls.length;
  document.getElementById('statSold').textContent = dolls.filter(d => d.sold).length;
  document.getElementById('statAvailable').textContent = dolls.filter(d => !d.sold).length;
  document.getElementById('statOrders').textContent = orders.filter(o => o.status === 'pending').length;
}

function renderDolls() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  dolls.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (item.sold ? ' sold' : '');
    card.innerHTML = `
      <div class="sold-badge">已售出</div>
      <div class="img-wrap" onclick="triggerUpload('${item.id}')">
        ${item.image_url ? `<img src="${item.image_url}" alt="">` : `<div class="img-placeholder">點擊上傳照片</div>`}
      </div>
      <div class="card-body">
        <input class="name-input" value="${escapeHtml(item.name)}" onchange="updateField('${item.id}','name',this.value)">
        <div class="price-row">
          <span>HK$</span>
          <input class="price-input" type="number" min="0" value="${item.price}" onchange="updateField('${item.id}','price',this.value)">
        </div>
        <div class="card-actions">
          <button class="btn-sold ${item.sold ? 'is-sold' : ''}" onclick="toggleSold('${item.id}')">${item.sold ? '↩ 標為未售' : '✔ 標為已售'}</button>
          <button class="btn-danger" onclick="deleteCard('${item.id}')">🗑</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  updateStats();
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  if (orders.length === 0) { list.innerHTML = '<p style="text-align:center;color:#999">目前沒有訂單</p>'; updateStats(); return; }
  list.innerHTML = orders.map(o => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>${escapeHtml(o.customer_name || '匿名客人')}</h3>
        <span class="order-status ${o.status}">${o.status === 'pending' ? '待處理' : '已完成'}</span>
      </div>
      <p style="font-size:13px;color:#777">聯絡方式：${escapeHtml(o.contact || '未提供')} ｜ ${new Date(o.created_at).toLocaleString('zh-HK')}</p>
      <ul>${(o.items || []).map(i => `<li>${escapeHtml(i.name)} - HK$${i.price}</li>`).join('')}</ul>
      <p><b>總金額：HK$${o.total}</b></p>
      <button class="btn-primary" onclick="toggleOrderStatus('${o.id}','${o.status}')">${o.status === 'pending' ? '標記已完成' : '重新標為待處理'}</button>
    </div>
  `).join('');
  updateStats();
}

async function toggleOrderStatus(id, current) {
  const newStatus = current === 'pending' ? 'done' : 'pending';
  const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', id);
  if (error) alert('更新失敗：' + error.message);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function addCard() {
  const { error } = await sb.from('dolls').insert({ name: '新玩偶', price: 0, sold: false });
  if (error) alert('新增失敗：' + error.message);
}

async function deleteCard(id) {
  if (!confirm('確定要刪除這個玩偶卡片嗎？')) return;
  const { error } = await sb.from('dolls').delete().eq('id', id);
  if (error) alert('刪除失敗：' + error.message);
}

async function toggleSold(id) {
  const item = dolls.find(i => i.id === id);
  const { error } = await sb.from('dolls').update({ sold: !item.sold, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) alert('更新失敗：' + error.message);
}

async function updateField(id, field, value) {
  if (field === 'price') value = parseFloat(value) || 0;
  const { error } = await sb.from('dolls').update({ [field]: value, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) alert('更新失敗：' + error.message);
}

function triggerUpload(id) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fileName = `${id}-${Date.now()}.${file.name.split('.').pop()}`;
    const { error: upErr } = await sb.storage.from('doll-images').upload(fileName, file, { upsert: true });
    if (upErr) { alert('上傳失敗：' + upErr.message); return; }
    const { data } = sb.storage.from('doll-images').getPublicUrl(fileName);
    const { error } = await sb.from('dolls').update({ image_url: data.publicUrl, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) alert('更新失敗：' + error.message);
  };
  input.click();
}
</script>

</body>
</html>
